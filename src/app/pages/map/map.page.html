<ion-header class="ion-no-border codex-header">
  <ion-toolbar class="codex-toolbar">
    <div class="header-inner">
      <div class="brand-left clickable" (click)="goToHome()" title="Ir a Inicio">
        <button type="button" class="back-btn" (click)="goToHome()" aria-label="Volver">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </button>
        <img src="assets/icon/last_codex.png" alt="LastResources Logo" class="brand-emblem" />
        <div>
          <span class="brand-name">LastResources</span>
          <span class="brand-subtitle">{{ currentLang === 'es' ? 'Mapa de Aethric' : 'Aethric World Map' }}</span>
        </div>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="map-content-no-scroll" [fullscreen]="true">
  <!-- Loading overlay while iframe and high-res map textures initialize -->
  <div *ngIf="isLoadingMap" class="map-loading-overlay">
    <div class="loading-spinner-box">
      <ion-icon name="map-outline" class="loading-map-icon"></ion-icon>
      <div class="loading-text">{{ currentLang === 'es' ? 'Cargando Mapa de Aethric...' : 'Loading Aethric Map...' }}</div>
      <div class="loading-subtext">{{ currentLang === 'es' ? 'Preparando marcadores y ciudades' : 'Preparing markers and cities' }}</div>
    </div>
  </div>

  <iframe
    [src]="mapViewerUrl"
    class="map-frame"
    [class.loaded]="!isLoadingMap"
    (load)="onMapLoaded()"
    allow="fullscreen"
    title="Aethric Map Viewer"
  ></iframe>
</ion-content>
