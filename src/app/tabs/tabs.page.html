<ion-tabs>

  <ion-tab-bar slot="bottom" class="codex-semicircular-bar">
    <ion-tab-button tab="home" href="/home">
      <ion-icon aria-hidden="true" name="home"></ion-icon>
      <ion-label>{{ currentLang === 'es' ? 'Inicio' : 'Home' }}</ion-label>
    </ion-tab-button>


    <ion-tab-button tab="calendar" href="/calendar">
      <ion-icon aria-hidden="true" name="calendar"></ion-icon>
      <ion-label>{{ currentLang === 'es' ? 'Calendario' : 'Calendar' }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="codex" href="/codex">
      <ion-icon aria-hidden="true" name="book"></ion-icon>
      <ion-label>Codex</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="settings" href="/settings">
      <ion-icon aria-hidden="true" name="settings"></ion-icon>
      <ion-label>{{ currentLang === 'es' ? 'Ajustes' : 'Settings' }}</ion-label>
    </ion-tab-button>
